[project]
name = "farmpulse"
version = "1.0.0"
description = "FarmPulse Agricultural Market Price Prediction and Decision Support System"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "joblib>=1.3.2",
    "google-auth>=2.28.0",
    "boto3>=1.34.0"
]

[tool.vercel]
entrypoint = "app.main:app"